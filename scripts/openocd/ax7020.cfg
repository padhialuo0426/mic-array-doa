# AX7020 onboard Digilent-compatible FT232H JTAG. With several FTDI adapters
# attached, add: adapter serial <your adapter serial>
source [find interface/ftdi/digilent_jtag_smt2_nc.cfg]
source [find target/zynq_7000.cfg]
adapter speed 10000
# This OpenOCD Cortex-A SMP build dereferences its GDB service during halt;
# keep an ephemeral loopback listener even though scripts use no GDB client.
bindto 127.0.0.1
gdb_port 3333
tcl_port disabled
telnet_port disabled
